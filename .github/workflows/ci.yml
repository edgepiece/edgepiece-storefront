name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only repository access.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by digest.
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile # v2.15.1

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  build-and-smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t edgepiece-storefront:ci .

      - name: Start container
        run: docker run -d --name storefront -p 8080:8080 edgepiece-storefront:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080 -o page.html; then
              grep -q "<title>Edgepiece</title>" page.html && echo "OK: page served" && exit 0
              echo "Page served but title missing" && exit 1
            fi
            echo "Attempt $i: not ready yet"; sleep 1
          done
          echo "Container never became ready"; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs storefront
